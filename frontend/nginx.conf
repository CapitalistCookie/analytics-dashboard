server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Increase client max body size for larger images
    client_max_body_size 10M;

    # Enhanced Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # API proxy to backend with buffering
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable buffering for better performance
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;

        # Short cache for API responses (browser-side)
        add_header Cache-Control "private, max-age=1";
    }

    # WebSocket proxy for real-time dashboard updates
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Frigate proxy for camera images (^~ gives priority over regex locations)
    location ^~ /frigate/ {
        proxy_pass http://host.docker.internal:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Enable buffering for snapshot images
        proxy_buffering on;

        # Short browser cache for snapshots (1 second)
        add_header Cache-Control "public, max-age=1";
    }

    # Special handling for Frigate MJPEG streams (no buffering needed)
    location ~* ^/frigate/api/[^/]+$ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Disable buffering for live streams
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # MQTT WebSocket proxy for real-time detection updates
    location ^~ /mqtt/ {
        proxy_pass http://host.docker.internal:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # go2rtc proxy for live streams (WebRTC, MJPEG, snapshots)
    location ^~ /go2rtc/ {
        proxy_pass http://host.docker.internal:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Disable buffering for MJPEG streams
        proxy_buffering off;

        # Disable caching for live content
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
