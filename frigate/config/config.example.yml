mqtt:
  enabled: true
  host: 172.20.0.2
  port: 1883
  topic_prefix: frigate
  client_id: frigate

auth:
  enabled: true

semantic_search:
  enabled: true
  reindex: false
  model_size: large

face_recognition:
  enabled: true
  min_area: 1500
  detection_threshold: 0.7
  recognition_threshold: 0.85
  model_size: large
  save_attempts: 100

detectors:
  onnx:
    type: onnx

model:
  path: /config/model_cache/onnx/yolov8m.onnx
  width: 640
  height: 640
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
  model_type: yolo-generic

database:
  path: /media/frigate/frigate.db

record:
  enabled: true
  retain:
    days: 0
    mode: all
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  export:
    timelapse_args: -vf setpts=0.04*PTS -r 30

snapshots:
  enabled: true
  bounding_box: true
  crop: false
  retain:
    default: 30

motion:
  threshold: 20
  contour_area: 15
  improve_contrast: true
  frame_alpha: 0.04

detect:
  enabled: true
  width: 1920
  height: 1080
  fps: 5
  max_disappeared: 150
  stationary:
    interval: 15
    threshold: 30
    max_frames:
      default: 3000
      objects:
        person: 0

objects:
  track:
    - person
    - car
    - dog
    - cat
    - motorcycle
    - bicycle
  filters:
    person:
      min_area: 2500
      min_score: 0.5
      threshold: 0.7

ffmpeg:
  hwaccel_args: preset-nvidia-h265
  retry_interval: 10

go2rtc:
  streams:
    cam_009:
      - rtsp://admin:jmj55555@192.168.1.XXX:554/Streaming/Channels/101
      - ffmpeg:cam_009#video=copy#audio=copy#audio=opus
    cam_009_sub:
      - rtsp://admin:jmj55555@192.168.1.XXX:554/Streaming/Channels/102
    cam_026:
