    cam_192_sub:
      - rtsp://admin:jmj55555@192.168.1.XXX:554/Streaming/Channels/102
    # CamHi cameras - use single stream (640x480) with TCP transport
    # These cameras have limited concurrent connections, so we use one stream for both record and detect
    cam_237:
      - rtsp://admin:CHANGE_ME@192.168.1.XXX:554/cam/realmonitor?channel=1&subtype=0#tcp
      - ffmpeg:cam_237#video=copy#audio=copy#audio=opus
    cam_237_sub:
      - rtsp://admin:CHANGE_ME@192.168.1.XXX:554/cam/realmonitor?channel=1&subtype=0#tcp
    cam_238:
      - rtsp://admin:CHANGE_ME@192.168.1.XXX:554/cam/realmonitor?channel=1&subtype=0#tcp
      - ffmpeg:cam_238#video=copy#audio=copy#audio=opus
    cam_238_sub:
      - rtsp://admin:CHANGE_ME@192.168.1.XXX:554/cam/realmonitor?channel=1&subtype=0#tcp
    cam_239:
