[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
addopts = -v --tb=short

# Integration test markers
markers =
    integration: mark test as integration test
    frigate: mark test as Frigate integration test
    influxdb: mark test as InfluxDB integration test
    mqtt: mark test as MQTT integration test
    e2e: mark test as end-to-end integration test

# Timeout for slow tests
timeout = 60
