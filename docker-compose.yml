services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Frigate NVR connection
      - FRIGATE_URL=http://host.docker.internal:5000
      # Frigate faces directory (for face recognition registration)
      - FRIGATE_FACES_PATH=/frigate/clips/faces
      # InfluxDB for time-series data
      - INFLUXDB_URL=http://host.docker.internal:8086
      - INFLUXDB_TOKEN=frigate-analytics-token-2024
      - INFLUXDB_ORG=frigate
      - INFLUXDB_BUCKET=analytics
      # SQLite database
      - SQLITE_DATABASE_URL=sqlite:///./data/analytics.db
      # JWT Authentication - CHANGE IN PRODUCTION
      - JWT_SECRET_KEY=restaurant-analytics-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      # MQTT for ReID worker
      - MQTT_HOST=host.docker.internal
      - MQTT_PORT=1883
      # ReID configuration - increased thresholds to reduce over-matching
      - REID_SIMILARITY_THRESHOLD=0.80
      - REID_CROSS_CAMERA_THRESHOLD=0.75
      - REID_MIN_MATCH_EMBEDDINGS=2
      - REID_EMBEDDINGS_PER_PERSON=5
      - REID_MIN_DETECTION_AREA=2000
      # Frigate config for detection tuning
      - FRIGATE_CONFIG_PATH=/frigate/config/config.yml
      - CONFIG_HISTORY_PATH=/app/data/config_history
    volumes:
      - backend-data:/app/data
      # Mount Frigate faces directory for face recognition
      - /mnt/hdd/frigate/clips/faces:/frigate/clips/faces
      # Mount Frigate config directory for detection tuning
      - /home/claude-user/frigate/config:/frigate/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytics-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  backend-data:
